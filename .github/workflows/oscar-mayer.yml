name: Oscar Mayer — Crawl & Compare

on:
  workflow_dispatch:
  # Uncomment to run automatically on a schedule (e.g. every weekday at 10 AM UTC)
  # schedule:
  #   - cron: '0 10 * * 1-5'

# Required for GitHub Pages deployment and history branch writes
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  crawl-and-compare:
    name: Crawl & Compare Oscar Mayer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Prevent simultaneous Pages deployments across workflows
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── Setup ────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Restore Allure history cache ─────────────────────────────────────────
      - name: Restore Allure history cache
        uses: actions/cache/restore@v4
        with:
          path: .allure-history-cache
          key: allure-history-oscar-mayer-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: allure-history-oscar-mayer-${{ github.ref_name }}-

      # ── Crawl Oscar Mayer sitemap ─────────────────────────────────────────────
      - name: Crawl Oscar Mayer sitemap
        run: npm run crawl:oscar-mayer

      - name: Show discovered pages
        run: |
          echo "Pages discovered:"
          node -e "
            const p = require('./sites/oscar-mayer/pages.json');
            p.comparisons.forEach((c, i) => console.log(\`  \${i + 1}. \${c.name}\`));
            console.log(\`\nTotal: \${p.comparisons.length} page(s)\`);
          "

      # ── Run comparison tests ──────────────────────────────────────────────────
      - name: Run Oscar Mayer comparison
        id: run_comparison
        continue-on-error: true
        env:
          PREVIEW_USERNAME: ${{ secrets.PREVIEW_USERNAME }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
        run: npm run compare:oscar-mayer

      # ── Inject previous Allure history ────────────────────────────────────────
      - name: Inject previous Allure history
        if: always() && hashFiles('.allure-history-cache/history') != ''
        run: |
          mkdir -p allure-results
          cp -r .allure-history-cache/history allure-results/history

      # ── Generate Allure report ────────────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: npm run allure:generate

      # ── Persist updated history in cache ─────────────────────────────────────
      - name: Update Allure history cache payload
        if: always()
        run: |
          mkdir -p .allure-history-cache
          cp -r allure-report/history .allure-history-cache/history

      - name: Save Allure history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .allure-history-cache
          key: allure-history-oscar-mayer-${{ github.ref_name }}-${{ github.run_id }}

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oscar-mayer-reports-${{ github.run_number }}
          path: sites/oscar-mayer/reports/
          retention-days: 30

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oscar-mayer-allure-run-${{ github.run_number }}
          path: allure-report/
          retention-days: 90

      # ── Publish Oscar Mayer history to GitHub Pages (main branch only) ────────
      # Maintains an oscar-mayer-history branch that accumulates every run's
      # Allure report under reports/<runStamp>/ and serves an index.html dashboard.
      # This branch is served at /oscar-mayer/ on the shared GitHub Pages site.

      - name: Configure Git identity
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone or initialise oscar-mayer-history branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$REPO_URL" oscar-mayer-history; then
            git clone --branch oscar-mayer-history --single-branch "$REPO_URL" .pages-site
            echo "Cloned oscar-mayer-history branch — $(git -C .pages-site rev-list --count HEAD) commit(s)"
          else
            echo "Branch oscar-mayer-history does not exist yet — creating orphan branch"
            mkdir -p .pages-site
            cd .pages-site
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan oscar-mayer-history
            git commit --allow-empty -m "chore: initialise oscar-mayer-history branch [skip ci]"
          fi

      - name: Update Oscar Mayer history dashboard
        if: github.ref == 'refs/heads/main'
        env:
          PAGES_SITE_DIR:    .pages-site
          SOURCE_REPORT_DIR: allure-report
          URLS_CONFIG:       sites/oscar-mayer/pages.json
          SITE_TITLE:        "Oscar Mayer — Preview vs Production"
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID:     ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA:        ${{ github.sha }}
        run: node scripts/update-pages-history-site.mjs

      - name: Push oscar-mayer-history branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .pages-site
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:oscar-mayer-history

      # ── Build combined Pages artifact ─────────────────────────────────────────
      # Root (/) comes from the report-history branch (ad-hoc compare dashboard).
      # /oscar-mayer/ comes from the oscar-mayer-history branch (this workflow).
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Start with the oscar-mayer-history content (already cloned into .pages-site)
          # Place it at /oscar-mayer/
          mkdir -p .pages-artifact/oscar-mayer
          cp -r .pages-site/. .pages-artifact/oscar-mayer/
          rm -rf .pages-artifact/oscar-mayer/.git

          # Include root report-history content if the branch exists
          if git ls-remote --exit-code --heads "$REPO_URL" report-history 2>/dev/null; then
            git clone --branch report-history --single-branch "$REPO_URL" .root-site
            cp -r .root-site/. .pages-artifact/
            rm -rf .pages-artifact/.git
            echo "Ad-hoc compare history included at /"
          else
            echo "report-history branch not found — root will only show Oscar Mayer section"
            # Create a minimal root index that redirects to /oscar-mayer/
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en"><head>' \
              '  <meta charset="UTF-8">' \
              '  <meta http-equiv="refresh" content="0; url=oscar-mayer/">' \
              '  <title>KraftHeinz Automation Reports</title>' \
              '</head><body>' \
              '  <p>Redirecting to <a href="oscar-mayer/">Oscar Mayer reports</a>...</p>' \
              '</body></html>' \
              > .pages-artifact/index.html
          fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-artifact/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
