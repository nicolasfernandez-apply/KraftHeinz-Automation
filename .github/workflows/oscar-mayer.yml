name: Oscar Mayer — Crawl & Compare

on:
  workflow_dispatch:
  # Uncomment to run automatically on a schedule (e.g. every weekday at 10 AM UTC)
  # schedule:
  #   - cron: '0 10 * * 1-5'

# Write access for history branch; Pages deployment is handled by deploy-pages.yml
permissions:
  contents: write
  actions: read

jobs:
  crawl-and-compare:
    name: Crawl & Compare Oscar Mayer
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Setup ────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Restore Allure history cache ─────────────────────────────────────────
      - name: Restore Allure history cache
        uses: actions/cache/restore@v4
        with:
          path: .allure-history-cache
          key: allure-history-oscar-mayer-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: allure-history-oscar-mayer-${{ github.ref_name }}-

      # ── Crawl Oscar Mayer sitemap ─────────────────────────────────────────────
      - name: Crawl Oscar Mayer sitemap
        run: npm run crawl:oscar-mayer

      - name: Show discovered pages
        run: |
          COUNT=$(node -e "const p = require('./sites/oscar-mayer/pages.json'); console.log(p.comparisons.length);")
          echo "Total pages discovered: ${COUNT}"
          node -e "
            const p = require('./sites/oscar-mayer/pages.json');
            p.comparisons.forEach((c, i) => console.log('  ' + (i + 1) + '. ' + c.name));
          "
          if [ "$COUNT" -le 1 ]; then
            echo "::warning::Only ${COUNT} page(s) discovered. The sitemap may be unreachable from GitHub Actions runners (many sites block CI IP ranges). Check the 'Crawl Oscar Mayer sitemap' step logs for errors."
          fi

      # ── Refresh design tokens from Figma ─────────────────────────────────────
      # Overwrites sites/oscar-mayer/design-tokens.json with the latest tokens.
      # continue-on-error: if the Figma API is unreachable the existing committed
      # file is used and the comparison continues normally.
      - name: Refresh Oscar Mayer design tokens
        continue-on-error: true
        env:
          FIGMA_TOKEN:    ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: 4x9zraTVxAlxseCdCeEyYz
        run: node sites/oscar-mayer/refresh-tokens.mjs

      # ── Run comparison tests ──────────────────────────────────────────────────
      # continue-on-error so the Allure report is always generated even on failure.
      - name: Run Oscar Mayer comparison
        id: run_comparison
        continue-on-error: true
        env:
          PREVIEW_USERNAME: ${{ secrets.PREVIEW_USERNAME }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
        run: npm run compare:oscar-mayer

      - name: Show allure result count
        if: always()
        run: |
          COUNT=$(find allure-results -maxdepth 1 -name "*-result.json" 2>/dev/null | wc -l | tr -d ' ')
          echo "Test result files generated: ${COUNT}"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No allure result files found. The tests may have failed before producing results."
          fi

      # ── Inject previous Allure history ────────────────────────────────────────
      - name: Inject previous Allure history
        if: always() && hashFiles('.allure-history-cache/history') != ''
        run: |
          mkdir -p allure-results
          cp -r .allure-history-cache/history allure-results/history

      # ── Generate Allure report ────────────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        env:
          URLS_CONFIG:       sites/oscar-mayer/pages.json
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID:     ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: npm run allure:generate

      # ── Persist updated history in cache ─────────────────────────────────────
      - name: Update Allure history cache payload
        if: always()
        run: |
          mkdir -p .allure-history-cache
          cp -r allure-report/history .allure-history-cache/history

      - name: Save Allure history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .allure-history-cache
          key: allure-history-oscar-mayer-${{ github.ref_name }}-${{ github.run_id }}

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oscar-mayer-reports-${{ github.run_number }}
          path: sites/oscar-mayer/reports/
          retention-days: 30

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oscar-mayer-allure-run-${{ github.run_number }}
          path: allure-report/
          retention-days: 90

      # ── Publish Oscar Mayer history to oscar-mayer-history branch ────────────
      # The deploy-pages.yml workflow picks this up and publishes it to /oscar-mayer/
      # on the shared GitHub Pages site.

      - name: Configure Git identity
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone or initialise oscar-mayer-history branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$REPO_URL" oscar-mayer-history; then
            git clone --branch oscar-mayer-history --single-branch "$REPO_URL" .pages-site
            echo "Cloned oscar-mayer-history branch — $(git -C .pages-site rev-list --count HEAD) commit(s)"
          else
            echo "Branch oscar-mayer-history does not exist yet — creating orphan branch"
            mkdir -p .pages-site
            cd .pages-site
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan oscar-mayer-history
            git commit --allow-empty -m "chore: initialise oscar-mayer-history branch [skip ci]"
          fi

      - name: Update Oscar Mayer history dashboard
        if: github.ref == 'refs/heads/main'
        env:
          PAGES_SITE_DIR:    .pages-site
          SOURCE_REPORT_DIR: allure-report
          URLS_CONFIG:       sites/oscar-mayer/pages.json
          SITE_TITLE:        "Oscar Mayer — Preview vs Production"
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID:     ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA:        ${{ github.sha }}
        run: node scripts/update-pages-history-site.mjs

      - name: Push oscar-mayer-history branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .pages-site
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:oscar-mayer-history

      # Pages deployment is handled by deploy-pages.yml, which is triggered
      # automatically when this workflow finishes.
