name: URL Comparison — Preview vs Production

on:
  workflow_dispatch:
    inputs:
      urls_json:
        description: >
          URL pairs to compare (paste the full JSON content).
          Leave empty to use the urls.config.json file already in the repository.

          Expected format:
          {
            "comparisons": [
              { "name": "Page Name", "previewUrl": "https://prv...", "productionUrl": "https://prod..." },
              { "name": "Another Page", "previewUrl": "https://prv...", "productionUrl": "https://prod..." }
            ]
          }
        required: false
        type: string

  # Uncomment to run automatically on a schedule (e.g. every weekday at 9 AM UTC)
  # schedule:
  #   - cron: '0 9 * * 1-5'

# Required for GitHub Pages deployment and history branch writes
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  compare:
    name: Compare Preview vs Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── Setup ────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Restore Allure history cache ─────────────────────────────────────────
      # Restores the history folder from the previous run so Allure can render
      # trend charts across multiple runs.
      - name: Restore Allure history cache
        uses: actions/cache/restore@v4
        with:
          path: .allure-history-cache
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: allure-history-${{ github.ref_name }}-

      # ── Resolve URL config ────────────────────────────────────────────────────
      - name: Prepare URL configuration
        env:
          URLS_JSON_INPUT: ${{ inputs.urls_json }}
        run: |
          if [ -n "$URLS_JSON_INPUT" ]; then
            echo "Source: workflow input JSON"
            echo "$URLS_JSON_INPUT" > /tmp/urls-input.json

            python3 -c "
          import json, sys
          try:
            data = json.load(open('/tmp/urls-input.json'))
            pairs = data.get('comparisons', [])
            if not pairs:
              raise ValueError('\"comparisons\" array is empty or missing')
            print(f'Valid — {len(pairs)} comparison(s) found:')
            for p in pairs:
              print(f'  • {p.get(\"name\", \"(unnamed)\")}')
          except Exception as e:
            print(f'ERROR: {e}', file=sys.stderr)
            sys.exit(1)
            "

            echo "URLS_CONFIG=/tmp/urls-input.json" >> "$GITHUB_ENV"
          else
            echo "Source: urls.config.json from repository"
            echo "URLS_CONFIG=urls.config.json" >> "$GITHUB_ENV"
          fi

      # ── Run comparison tests ──────────────────────────────────────────────────
      # continue-on-error so the Allure report is always generated even on failure.
      - name: Run URL comparison
        id: run_comparison
        continue-on-error: true
        env:
          PREVIEW_USERNAME: ${{ secrets.PREVIEW_USERNAME }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
        run: npm run compare

      # ── Inject previous Allure history ────────────────────────────────────────
      # Copies the cached history into allure-results/ so trend data is preserved.
      - name: Inject previous Allure history
        if: always() && hashFiles('.allure-history-cache/history') != ''
        run: |
          mkdir -p allure-results
          cp -r .allure-history-cache/history allure-results/history

      # ── Generate Allure report ────────────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: npm run allure:generate

      # ── Persist updated history in cache ─────────────────────────────────────
      - name: Update Allure history cache payload
        if: always()
        run: |
          mkdir -p .allure-history-cache
          cp -r allure-report/history .allure-history-cache/history

      - name: Save Allure history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .allure-history-cache
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-run-${{ github.run_number }}
          path: allure-report/
          retention-days: 90

      # ── Deploy Allure report to GitHub Pages (main branch only) ───────────────
      # To enable: go to Settings → Pages → Source → GitHub Actions
      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
