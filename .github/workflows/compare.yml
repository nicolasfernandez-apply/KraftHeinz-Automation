name: URL Comparison — Preview vs Production

on:
  workflow_dispatch:
    inputs:
      urls_json:
        description: >
          URL pairs to compare (paste the full JSON content).
          Leave empty to use the urls.config.json file already in the repository.

          Expected format:
          {
            "comparisons": [
              { "name": "Page Name", "previewUrl": "https://prv...", "productionUrl": "https://prod..." },
              { "name": "Another Page", "previewUrl": "https://prv...", "productionUrl": "https://prod..." }
            ]
          }
        required: false
        type: string

  # Uncomment to run automatically on a schedule (e.g. every weekday at 9 AM UTC)
  # schedule:
  #   - cron: '0 9 * * 1-5'

jobs:
  compare:
    name: Compare Preview vs Production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Resolve URL config ──────────────────────────────────────────────────
      # If the user pasted JSON via the workflow_dispatch input, write it to a
      # temp file and point URLS_CONFIG at it.  Otherwise fall back to the
      # urls.config.json committed in the repository.
      - name: Prepare URL configuration
        env:
          URLS_JSON_INPUT: ${{ inputs.urls_json }}
        run: |
          if [ -n "$URLS_JSON_INPUT" ]; then
            echo "Source: workflow input JSON"
            echo "$URLS_JSON_INPUT" > /tmp/urls-input.json

            # Validate that it is parseable JSON before proceeding
            python3 -c "
          import json, sys
          try:
            data = json.load(open('/tmp/urls-input.json'))
            pairs = data.get('comparisons', [])
            if not pairs:
              raise ValueError('\"comparisons\" array is empty or missing')
            print(f'Valid — {len(pairs)} comparison(s) found:')
            for p in pairs:
              print(f'  • {p.get(\"name\", \"(unnamed)\")}')
          except Exception as e:
            print(f'ERROR: {e}', file=sys.stderr)
            sys.exit(1)
            "

            echo "URLS_CONFIG=/tmp/urls-input.json" >> "$GITHUB_ENV"
          else
            echo "Source: urls.config.json from repository"
            echo "URLS_CONFIG=urls.config.json" >> "$GITHUB_ENV"
          fi

      # ── Run comparison ──────────────────────────────────────────────────────
      - name: Run URL comparison
        env:
          # Credentials stored as repository secrets:
          # Settings → Secrets and variables → Actions → New repository secret
          PREVIEW_USERNAME: ${{ secrets.PREVIEW_USERNAME }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
          # URLS_CONFIG is set by the "Prepare URL configuration" step above
        run: npm run compare

      # ── Upload reports ──────────────────────────────────────────────────────
      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
