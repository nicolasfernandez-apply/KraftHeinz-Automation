name: URL Comparison — Preview vs Production

on:
  # Run manually from the Actions tab
  workflow_dispatch:
    inputs:
      config_file:
        description: "Path to the URL config JSON file (relative to repo root)"
        required: false
        default: "urls.config.json"

  # Uncomment to run automatically on a schedule (e.g. every weekday at 9 AM UTC)
  # schedule:
  #   - cron: '0 9 * * 1-5'

jobs:
  compare:
    name: Compare Preview vs Production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run URL comparison
        env:
          # Credentials are stored as repository secrets:
          # Settings → Secrets and variables → Actions → New repository secret
          PREVIEW_USERNAME: ${{ secrets.PREVIEW_USERNAME }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
          # Override the config file path if provided via workflow_dispatch input
          URLS_CONFIG: ${{ inputs.config_file || 'urls.config.json' }}
        run: npm run compare

      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
